<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Network | THE SOCIETY</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .member-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(14px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .member-card:hover {
            transform: translateY(-4px);
            border-color: rgba(140, 175, 200, 0.35);
        }

        .member-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .member-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #174a6e, #002147);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #ffffff;
            font-weight: bold;
            margin-right: 14px;
        }
    </style>
</head>

<body>

    <header id="societyHeader"></header>

    <main class="app-page">

        <div class="page-header">
            <div>
                <span class="hero-tagline">COLLEGE DIRECTORY</span>
                <h1>Community <em>Network</em></h1>
                <p>Connect with students, seniors, and distinguished alumni across all branches.</p>
            </div>
            <a href="dashboard.html" class="secondary-btn">← Back to Dashboard</a>
        </div>

        <!-- Filter & Search Bar -->
        <div class="filter-bar">
            <input
                type="text"
                id="searchInput"
                class="search-input-box"
                placeholder="Search by name, skill (e.g. React, C++, AI), or domain..."
            >

            <select id="roleFilter" class="select-box">
                <option value="">All Roles</option>
                <option value="student">Students</option>
                <option value="senior">Seniors</option>
                <option value="alumni">Alumni</option>
            </select>

            <select id="branchFilter" class="select-box">
                <option value="">All Branches</option>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="IT">IT</option>
                <option value="EE">EE</option>
                <option value="MECH">MECH</option>
            </select>
        </div>

        <!-- Dynamic Members Grid -->
        <div id="membersGrid" class="cards-grid">
            <p style="color: var(--text-secondary); grid-column: 1 / -1;">Loading college network...</p>
        </div>

    </main>

    <!-- Member Profile Modal -->
    <div id="profileModal" class="modal-backdrop">
        <div class="modal-content">
            <button class="modal-close" onclick="closeProfileModal()">&times;</button>
            <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 16px;">
                <div id="modalAvatar" class="member-avatar" style="width: 60px; height: 60px; font-size: 1.6rem;">U</div>
                <div>
                    <h2 id="modalName" style="margin: 0; font-size: 1.5rem;">User Name</h2>
                    <p id="modalRoleBranch" style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px;">Role · Branch</p>
                </div>
            </div>

            <div id="modalBadges" style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px;"></div>

            <p style="font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;">About</p>
            <p id="modalBio" style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px;">No bio provided.</p>

            <p style="font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;">Skills</p>
            <div id="modalSkills" class="tags-row"></div>

            <div id="modalLinks" style="margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); display: flex; gap: 14px;"></div>

            <div class="btn-row" style="margin-top: 24px;">
                <button type="button" class="secondary-btn" onclick="closeProfileModal()">Close</button>
                <a id="modalActionBtn" href="mentorship.html" class="primary-btn">Request Mentorship →</a>
            </div>
        </div>
    </div>

    <script src="js/navbar.js"></script>
    <script>
        let allMembers = [];

        async function fetchMembers() {
            const search = document.getElementById("searchInput").value.trim();
            const role = document.getElementById("roleFilter").value;
            const branch = document.getElementById("branchFilter").value;

            const grid = document.getElementById("membersGrid");
            grid.innerHTML = '<p style="color: var(--text-secondary); grid-column: 1 / -1;">Searching members...</p>';

            const params = new URLSearchParams();
            if (search) params.append("search", search);
            if (role) params.append("role", role);
            if (branch) params.append("branch", branch);

            try {
                const res = await fetch(`http://localhost:5000/api/users?${params.toString()}`);
                const data = await res.json();

                if (res.ok) {
                    allMembers = data.users || [];
                    renderMembers(allMembers);
                } else {
                    grid.innerHTML = '<p style="color: #f87171; grid-column: 1 / -1;">Failed to load members.</p>';
                }
            } catch (err) {
                console.error("Network fetch error:", err);
                grid.innerHTML = '<p style="color: #f87171; grid-column: 1 / -1;">Server unreachable. Please check backend.</p>';
            }
        }

        function renderMembers(members) {
            const grid = document.getElementById("membersGrid");
            grid.innerHTML = "";

            if (members.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; background: var(--surface); border-radius: 16px; border: 1px solid var(--border);">
                        <p style="font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 8px;">No members found matching your search.</p>
                        <p style="font-size: 0.9rem; color: var(--text-muted);">Try searching for other branches, names, or skills like "React", "DSA", or "Python".</p>
                    </div>
                `;
                return;
            }

            members.forEach(m => {
                const card = document.createElement("div");
                card.className = "member-card";

                const initial = m.name ? m.name.charAt(0).toUpperCase() : "U";
                const roleClass = m.role ? m.role.toLowerCase() : "student";
                const skillsHtml = (m.skills || []).slice(0, 4).map(s => `<span class="skill-tag">${s}</span>`).join("");
                const repPoints = m.reputation !== undefined ? m.reputation : 20;

                card.innerHTML = `
                    <div class="card-top">
                        <div class="member-header">
                            <div style="display: flex; align-items: center;">
                                <div class="member-avatar">${initial}</div>
                                <div>
                                    <h3 style="font-size: 1.15rem; margin: 0; font-weight: 500;">${m.name}</h3>
                                    <p style="font-size: 0.82rem; color: var(--text-secondary); margin-top: 2px;">
                                        ${m.branch || 'CSE'} · Class of ${m.gradYear || '2027'}
                                    </p>
                                </div>
                            </div>
                            <span class="user-role-badge">${(m.role || 'Member').toUpperCase()}</span>
                        </div>

                        <p class="card-body" style="font-size: 0.88rem; margin: 12px 0 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
                            ${m.bio || 'College community member.'}
                        </p>

                        <div class="tags-row" style="margin-bottom: 10px;">
                            ${skillsHtml || '<span style="font-size: 0.78rem; color: var(--text-muted);">No skills listed yet</span>'}
                        </div>
                    </div>

                    <div class="card-actions">
                        <span style="font-size: 0.8rem; color: #facc15; font-weight: 600;">⭐ ${repPoints} pts</span>
                        <button class="secondary-btn" style="padding: 7px 14px; font-size: 0.85rem;" onclick="viewProfile('${m.id}')">View Profile</button>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function viewProfile(id) {
            const member = allMembers.find(m => m.id === id);
            if (!member) return;

            document.getElementById("modalAvatar").textContent = member.name ? member.name.charAt(0).toUpperCase() : "U";
            document.getElementById("modalName").textContent = member.name;
            document.getElementById("modalRoleBranch").textContent =
                `${(member.role || 'Member').toUpperCase()} · ${member.branch || 'CSE'} (${member.gradYear || '2027'}) · ${member.college || 'Engineering College'}`;

            document.getElementById("modalBio").textContent = member.bio || "No detailed bio added yet.";

            // Badges
            const badgesContainer = document.getElementById("modalBadges");
            badgesContainer.innerHTML = "";
            (member.badges || ["New Member"]).forEach(b => {
                const span = document.createElement("span");
                span.className = "badge-pill";
                span.textContent = b;
                badgesContainer.appendChild(span);
            });

            // Skills
            const skillsContainer = document.getElementById("modalSkills");
            skillsContainer.innerHTML = "";
            if (member.skills && member.skills.length) {
                member.skills.forEach(s => {
                    const span = document.createElement("span");
                    span.className = "skill-tag";
                    span.textContent = s;
                    skillsContainer.appendChild(span);
                });
            } else {
                skillsContainer.innerHTML = '<span style="color: var(--text-muted); font-size: 0.85rem;">No technical skills listed.</span>';
            }

            // Links
            const linksContainer = document.getElementById("modalLinks");
            linksContainer.innerHTML = "";
            if (member.github) {
                linksContainer.innerHTML += `<a href="${member.github}" target="_blank" style="color: #5aa0d0; font-size: 0.88rem;">🔗 GitHub</a>`;
            }
            if (member.linkedin) {
                linksContainer.innerHTML += `<a href="${member.linkedin}" target="_blank" style="color: #5aa0d0; font-size: 0.88rem;">🔗 LinkedIn</a>`;
            }
            if (!member.github && !member.linkedin) {
                linksContainer.innerHTML = `<span style="color: var(--text-muted); font-size: 0.85rem;">No external links attached.</span>`;
            }

            // Action button
            const actionBtn = document.getElementById("modalActionBtn");
            if (member.role === "senior" || member.role === "alumni" || member.isMentorAvailable) {
                actionBtn.style.display = "inline-block";
                actionBtn.href = `mentorship.html?mentorId=${member.id}`;
                actionBtn.textContent = "Request Mentorship →";
            } else {
                actionBtn.style.display = "none";
            }

            document.getElementById("profileModal").classList.add("show");
        }

        function closeProfileModal() {
            document.getElementById("profileModal").classList.remove("show");
        }

        document.getElementById("profileModal").addEventListener("click", function (e) {
            if (e.target === this) closeProfileModal();
        });

        // Event listeners with debounce
        let debounceTimer;
        document.getElementById("searchInput").addEventListener("input", function () {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(fetchMembers, 300);
        });

        document.getElementById("roleFilter").addEventListener("change", fetchMembers);
        document.getElementById("branchFilter").addEventListener("change", fetchMembers);

        // Initial load
        document.addEventListener("DOMContentLoaded", fetchMembers);
    </script>

</body>

</html>
